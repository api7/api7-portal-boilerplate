$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'

tasks:
  build:
    command: 'pnpm run build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'package.json'
    outputs:
      - 'dist'

  tsc:
    command: 'pnpm run tsc'
    deps:
      - 'build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
